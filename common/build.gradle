architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Only used for @Environment and mixin annotations; nothing loader-specific is called from common code.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    modCompileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-common:$rootProject.forge_config_api_port_version"
}
