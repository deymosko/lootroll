plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig 'lootroll-forge.mixins.json'
    }
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.minecraft_version-$rootProject.forge_version"
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Optional integrations: compile-time only, never required at runtime
    // (IntegrationMixinPlugin skips their mixins when the mod isn't installed).
    modCompileOnly "maven.modrinth:ice-and-fire-dragons:$rootProject.iceandfire_version"
    modCompileOnly "maven.modrinth:citadel:$rootProject.citadel_version"
    modCompileOnly "maven.modrinth:alexs-caves:$rootProject.alexscaves_version"
    modCompileOnly "maven.modrinth:dungeon-now-loading:$rootProject.dungeonnowloading_version"
}

processResources {
    def props = [
            version          : project.version,
            mod_id           : rootProject.mod_id,
            mod_name         : rootProject.mod_name,
            mod_authors      : rootProject.mod_authors,
            mod_description  : rootProject.mod_description,
            minecraft_version: rootProject.minecraft_version,
            architectury_api_version: rootProject.architectury_api_version,
    ]
    inputs.properties props

    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
